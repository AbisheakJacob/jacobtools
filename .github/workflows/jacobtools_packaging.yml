name: Jacobtools Packaging
on: [push]
jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install tox
        run: python -m pip install tox
      - name: Run Black
        run: tox -e format
  
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - version: "3.13"
            toxenv: "py313"
          - version: "3.12"
            toxenv: "py312"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python.version }}
      - name: Install tox
        run: python -m pip install tox
      - name: Run pytest
        run: tox -e ${{ matrix.python.toxenv }}

  build_wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install build
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: jacobtools-wheel
          path: wheels/*.whl
  
  build:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    needs: format   # optional but recommended
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install build package
        run: python -m pip install build
      - name: Build source distribution
        run: python -m build --sdist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*.tar.gz
