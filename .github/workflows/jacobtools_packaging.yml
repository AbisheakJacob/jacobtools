name: Jacobtools Packaging
on: [push]
jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install tox
        run: python -m pip install tox
      - name: Run Black
        run: tox -e format
