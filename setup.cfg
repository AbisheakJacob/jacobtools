[metadata]
name = JacobTools
version = 0.0.8
url = https://github.com/AbisheakJacob/JacobTools
author = Abisheak Jacob J 
author_email = "abisheakjacob0032@gmail.com"
description = This package contains functions that help me tackle my day to day data andalytics requirements
long_description = README.md 
long_description_content_type = text/markdown
license = MIT
license_file = LICENSE 
classifiers= 
  License :: OSI Approved :: MIT License 

[options]
package_dir =
  =src
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
  numpy>=2.1.0
  termcolor>=1.1.0

[options.packages.find]
where = src
exclude = 
  test*

[options.entry_points]
console_scripts =
  harmony = jacobtools_test.harmony:main

[flake8]
max-line-length = 100

[tool:pytest]
testpaths = 
  test
addopts =
  --cov
  --strict-markers
  --disable-warnings
xfail_strict = True

[coverage:run]
branch = True
source = jacobtools_test

[coverage:report]
show_missing = True
skip_covered = True

[coverage:paths]
source =
  src/jacobtools_test/
  */site-packages/jacobtools_test/

[tox:tox]
isolated_build = True
envlist = py312

[testimports]
deps =
  pytest
  requests

[testenv]
deps =
  {[testimports]deps}
  pytest-cov
commands =
  pytest {posargs}

[testenv:typecheck]
deps =
  mypy
    pytest
    types-termcolor
commands =
    mypy --ignore-missing-imports {posargs:src/jacobtools_test test}

[mypy]
python_version = 3.13
warn_unused_configs = True
show_error_context = True
pretty = True
namespace_packages = True
check_untyped_defs = True

[testenv:format]
skip_install = True
deps =
    black
commands =
    black {posargs:--check --diff src/jacobtools_test test}
  
[testenv:lint]
skip_install = True
deps =
    flake8
    flake8-bugbear
commands =
    flake8 {posargs:src/jacobtools_test test}