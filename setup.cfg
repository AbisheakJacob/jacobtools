[metadata]
name = AnalystStack
version = 0.0.11
url = https://github.com/AbisheakJacob/AnalystStack
author = Abisheak Jacob J
author_email = "abisheakjacob0032@gmail.com"
description = This package contains functions that help me tackle my day to day data andalytics requirements
long_description = README.md 
long_description_content_type = text/markdown
license = MIT
license_file = LICENSE 
classifiers= 
  License :: OSI Approved :: MIT License 

[options]
package_dir =
  =src
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
  pandas>=2.0
  jinja2>=3.1
  openpyxl>=3.1
  tabulate>=0.9
  sqlfluff>=3.0

[options.packages.find]
where = src
exclude =
  test*

[options.extras_require]
bigquery =
  google-cloud-bigquery>=3.0
  db-dtypes>=1.0
databricks =
  databricks-sql-connector>=3.0
dev =
  pytest>=8.0
  pytest-cov>=5.0
  mypy>=1.10
  ruff>=0.12
  build
  twine

[options.entry_points]
console_scripts =
  analyststack = AnalystStack.cli:main

[tool:pytest]
testpaths = 
  test
addopts =
  --cov
  --strict-markers
  --disable-warnings
xfail_strict = True

[coverage:run]
branch = True
source = AnalystStack

[coverage:report]
show_missing = True
skip_covered = True

[coverage:paths]
source =
  src/AnalystStack/
  */site-packages/AnalystStack/

[tox:tox]
isolated_build = True
envlist = py312, py313

[testenv]
extras =
  bigquery
deps =
  pytest>=8.0
  pytest-cov>=5.0
commands =
  pytest {posargs}

[testenv:typecheck]
deps =
  mypy>=1.10
  pytest
commands =
  mypy --ignore-missing-imports {posargs:src/AnalystStack test}

[mypy]
python_version = 3.13
warn_unused_configs = True
show_error_context = True
pretty = True
namespace_packages = True
check_untyped_defs = True

warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True

[testenv:format]
skip_install = True
deps =
    ruff
commands =
    ruff format {posargs:--check src/AnalystStack test}
  
[testenv:lint]
skip_install = True
deps =
    ruff
commands =
    ruff check {posargs:src/AnalystStack test}

[testenv:docs]
description = Build the documentation site using Zensical
skip_install = True
changedir = docs
deps =
    zensical
commands =
    zensical build --clean