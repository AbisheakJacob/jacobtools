[metadata]
name = AnalystStack
version = 0.0.8
url = https://github.com/AbisheakJacob/AnalystStack
author = Abisheak Jacob J 
author_email = "abisheakjacob0032@gmail.com"
description = This package contains functions that help me tackle my day to day data andalytics requirements
long_description = README.md 
long_description_content_type = text/markdown
license = MIT
license_file = LICENSE 
classifiers= 
  License :: OSI Approved :: MIT License 

[options]
package_dir =
  =src
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
  numpy>=2.1.0
  termcolor>=1.1.0

[options.packages.find]
where = src
exclude = 
  test*

# [options.entry_points]
# console_scripts =
#   harmony = AnalystStack.harmony:main

[flake8]
max-line-length = 120

[tool:pytest]
testpaths = 
  test
addopts =
  --cov
  --strict-markers
  --disable-warnings
xfail_strict = True

[coverage:run]
branch = True
source = AnalystStack

[coverage:report]
show_missing = True
skip_covered = True

[coverage:paths]
source =
  src/AnalystStack/
  */site-packages/AnalystStack/

[tox:tox]
isolated_build = True
envlist = py313

[testimports]
deps =
  pytest
  requests

[testenv]
deps =
  {[testimports]deps}
  pytest-cov
commands =
  pytest {posargs}

[testenv:typecheck]
deps =
  mypy
    pytest
    types-termcolor
commands =
    mypy --ignore-missing-imports {posargs:src/AnalystStack test}

[mypy]
python_version = 3.13
warn_unused_configs = True
show_error_context = True
pretty = True
namespace_packages = True
check_untyped_defs = True

[testenv:format]
skip_install = True
deps =
    black
commands =
    black {posargs:--check --diff src/AnalystStack test}
  
[testenv:lint]
skip_install = True
deps =
    flake8
    flake8-bugbear
commands =
    flake8 {posargs:src/AnalystStack test}

[testenv:docs]
description = Build and serve documentation using MkDocs
skip_install = True
deps =
    mkdocs
    mkdocs-material
commands =
    mkdocs build -f docs/mkdocs.yml -d site